<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="412" viewBox="0 0 1200 412" role="img"><title>发现素材、整理文章、编辑审核、上传微信草稿箱</title><g font-family="Arial, Helvetica, PingFang SC, Microsoft YaHei, sans-serif"><rect x="0" y="0" width="1200" height="412" rx="22" fill="#f3f7f8" stroke="none"/><text x="40" y="47" font-size="14" fill="#0f766e" font-weight="700">一篇文章，四个清晰步骤。</text><text x="40" y="89" font-size="32" fill="#152d3b" font-weight="700">从素材到草稿，每一步都看得见</text><rect x="40" y="124" width="258" height="185" rx="14" fill="#ffffff" stroke="#dbe5e9"/><rect x="60" y="143" width="39" height="31" rx="8" fill="#dbeafe" stroke="none"/><text x="69" y="165" font-size="17" fill="#1d4ed8" font-weight="700">01</text><text x="60" y="211" font-size="21" fill="#152d3b" font-weight="700">发现值得写的内容</text><text x="60" y="247" font-size="15" fill="#526575" font-weight="400">科技新闻网站</text><text x="60" y="273" font-size="15" fill="#526575" font-weight="400">GitHub 热门项目与 README</text><text x="305" y="223" font-size="23" fill="#69838d" font-weight="700">→</text><rect x="326" y="124" width="258" height="185" rx="14" fill="#ffffff" stroke="#dbe5e9"/><rect x="346" y="143" width="39" height="31" rx="8" fill="#ede9fe" stroke="none"/><text x="355" y="165" font-size="17" fill="#7c3aed" font-weight="700">02</text><text x="346" y="211" font-size="21" fill="#152d3b" font-weight="700">整理出文章初稿</text><text x="346" y="247" font-size="15" fill="#526575" font-weight="400">根据内容模式处理素材</text><text x="346" y="273" font-size="15" fill="#526575" font-weight="400">调用文本与图片服务</text><text x="591" y="223" font-size="23" fill="#69838d" font-weight="700">→</text><rect x="612" y="124" width="258" height="185" rx="14" fill="#ffffff" stroke="#dbe5e9"/><rect x="632" y="143" width="39" height="31" rx="8" fill="#ccfbf1" stroke="none"/><text x="641" y="165" font-size="17" fill="#0f766e" font-weight="700">03</text><text x="632" y="211" font-size="21" fill="#152d3b" font-weight="700">改成自己的表达</text><text x="632" y="247" font-size="15" fill="#526575" font-weight="400">Markdown 编辑与预览</text><text x="632" y="273" font-size="15" fill="#526575" font-weight="400">阅读、修改、润色</text><text x="877" y="223" font-size="23" fill="#69838d" font-weight="700">→</text><rect x="898" y="124" width="258" height="185" rx="14" fill="#ffffff" stroke="#dbe5e9"/><rect x="918" y="143" width="39" height="31" rx="8" fill="#fef3c7" stroke="none"/><text x="927" y="165" font-size="17" fill="#a16207" font-weight="700">04</text><text x="918" y="211" font-size="21" fill="#152d3b" font-weight="700">交付到微信草稿箱</text><text x="918" y="247" font-size="15" fill="#526575" font-weight="400">创建公众号草稿</text><text x="918" y="273" font-size="15" fill="#526575" font-weight="400">在微信后台完成发送</text><rect x="40" y="331" width="1116" height="49" rx="10" fill="#e2eeec" stroke="none"/><text x="60" y="361" font-size="16" fill="#365d59" font-weight="400">界面流程：审核后上传草稿  ·  Deno + TypeScript  ·  本地运行  ·  定时任务需显式开启</text></g></svg>
