<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img"><title>AITrendPublisher — From signal to story</title><g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="1200" height="500" rx="24" fill="#101e2b" stroke="none"/><circle cx="1120" cy="70" r="235" fill="#163a43"/><circle cx="1070" cy="45" r="155" fill="#1a4950"/><text x="52" y="65" font-size="22" fill="#f8fafc" font-weight="700">AITrendPublisher</text><rect x="52" y="102" width="216" height="30" rx="15" fill="#214a4b" stroke="none"/><text x="67" y="122" font-size="11" fill="#a7f3d0" font-weight="700">THE LOCAL PUBLISHING DESK</text><text x="52" y="207" font-size="66" fill="#f8fafc" font-weight="700">From signal</text><text x="52" y="279" font-size="66" fill="#8ee4c9" font-weight="700">to story.</text><text x="54" y="327" font-size="22" fill="#cbd5e1" font-weight="400">AI news. Open-source discoveries.</text><text x="54" y="359" font-size="22" fill="#cbd5e1" font-weight="400">Articles with an editor in the loop.</text><text x="54" y="452" font-size="13" fill="#8ee4c9" font-weight="700">DISCOVER  /  DRAFT  /  REFINE  /  WECHAT DRAFT BOX</text><rect x="687" y="88" width="445" height="340" rx="18" fill="#f8fafc" stroke="none"/><rect x="687" y="88" width="445" height="45" rx="18" fill="#e2e8f0" stroke="none"/><circle cx="709" cy="110" r="5" fill="#f87171"/><circle cx="727" cy="110" r="5" fill="#fbbf24"/><circle cx="745" cy="110" r="5" fill="#34d399"/><text x="774" y="115" font-size="12" fill="#475569" font-weight="700">YOUR NEXT ARTICLE</text><rect x="715" y="158" width="106" height="23" rx="7" fill="#d1fae5" stroke="none"/><text x="728" y="174" font-size="10" fill="#0f766e" font-weight="700">EDITOR REVIEW</text><text x="715" y="218" font-size="25" fill="#172b3a" font-weight="700">A discovery worth sharing</text><text x="715" y="251" font-size="16" fill="#64748b" font-weight="400">Clear context. Your perspective.</text><rect x="715" y="280" width="375" height="5" rx="2" fill="#d5dee5" stroke="none"/><rect x="715" y="294" width="352" height="5" rx="2" fill="#d5dee5" stroke="none"/><rect x="715" y="308" width="286" height="5" rx="2" fill="#d5dee5" stroke="none"/><rect x="715" y="345" width="174" height="46" rx="10" fill="#0f766e" stroke="none"/><text x="732" y="374" font-size="15" fill="#ffffff" font-weight="700">Send to draft box  →</text><text x="907" y="373" font-size="13" fill="#64748b" font-weight="400">You decide when.</text><text x="997" y="458" font-size="9" fill="#94a3b8" font-weight="400">WORKFLOW ILLUSTRATION</text></g></svg>
